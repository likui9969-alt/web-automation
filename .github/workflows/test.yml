# OrangeHRM 自动化测试 CI（M9，M11 全局收口审查 P1-2 整改）
#
# 为什么需要 CI（PLAN M9）：本地能跑 = 起点，无人值守的回归 = 质量红线。
# 每次 push 自动验证「改代码没有破坏任何既有行为」——面试谈"自动化为什么
# 必须进 CI"的答案就长在 workflow 上。
#
# 分层执行顺序（为什么 API 先跑）：API 快且稳，先跑出快速反馈；
# UI/e2e 慢且有公网波动，后跑。任何一层红 → pipeline 红（不允许静默）。
#
# CI 目标环境策略（M11 全局收口审查 P1-2 整改）：
#   **改走容器路径**。事实核对：GitHub hosted runner（ubuntu-latest）**预装
#   Docker 且 daemon 运行中**——旧版注释"CI runner 无 Docker daemon"是错误论据
#   （M11 复审 P1-2 已更正）。仓库内既有 M6 的被测系统 compose（db+app）
#   也有 M10 的测试镜像（Python+Playwright+Chromium），runner 有 Docker →
#   可跑出**确定性结果**（不走公网共享 Demo，避免环境瞬态打红）。
#   步骤：起被测系统（含首次无人值守安装）→ 建 ohrm_ro 只读账号 →
#   build 测试镜像 → 分层在容器内跑 → 上传报告/留痕。
#
#   ⚠️ 诚实声明（UNVERIFIED）：容器路径**已真实触发 3 次，尚未跑绿**。
#   ① 2026-09-17 首两次触发（run 35174500668 / 35174365514）→ 第 1 步「起被测系统」
#      即红（exit 3 / 76s）：根因 = `up` 未限定服务，连带构建并启动 test 容器，
#      `--wait` 因该一次性容器退出判失败。**已修复并实测通过（28s）。**
#   ② 同日第 3 次触发（run 35195498493）→ 起服务/DROP/安装/只读账号/构建镜像全部通过
#      （构建 37s），但三层测试各 1~2 秒失败、**exit 3**、artifact 全空 →
#      定性为 pytest 启动阶段 INTERNALERROR，指向容器内无法写 reports/（uid 1000 vs
#      runner 1001）。**已按此整改并加自证探针，尚未真跑验证。**
#   跑绿之前，任何简历/面试材料不得宣称"CI 已跑通"。
#
# 国内网络说明：GitHub runner 在海外，playwright CDN / pip / docker hub 均可达
#   （M10 镜像构建在本地已实测网络可拉取），不需要 npmmirror 镜像。

name: CI

on:
  push:
  pull_request:

# 同分支连推时取消进行中的旧运行（M9 Review P3-3）：避免并发跑满 runner、
# 产物互相覆盖；新 push 代表最新代码，旧运行的结果无保留价值。
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # M11 全局收口审查 P1-2 整改：CI 目标改容器路径。
      # runner 自带 Docker，仓库内 M6 被测系统 compose + M10 测试镜像齐全 –
      # 在容器内跑确定性结果，不走公网共享 Demo。
      # ⚠️ 必须显式列出 `db app`：compose 文件里的 test 服务没有 profiles，
      # 不限定服务时 `up` 会连带构建测试镜像并启动它（ENTRYPOINT 是无过滤的
      # `python -m pytest`）——既绕过下面的分层执行设计，又会让 --wait 因该
      # 一次性容器退出而判失败。
      # --wait-timeout：healthcheck 一直不过时不要挂到 job 的 45 分钟上限。
      - name: 起被测系统（M6 compose：db + app）
        id: up
        run: |
          set +e
          docker compose -f docker/docker-compose.yml up -d --wait --wait-timeout 300 db app
          rc=$?
          docker compose -f docker/docker-compose.yml ps -a
          if [ $rc -ne 0 ]; then
            echo "::group::compose 起服务失败 —— 导出诊断（把 M7「失败留痕」思路移植到 CI）"
            docker compose -f docker/docker-compose.yml logs --no-color --tail=200
            echo "::endgroup::"
            exit $rc
          fi

      # README「从零重建」明确要求：compose 为 DB 预置了空库 orangehrm 与用户 ohrm，
      # 而安装器以 isExistingDatabase: n 自建库 → 必须先 DROP 预置对象保证语义一致。
      # runner 每次都是全新卷，必然命中该场景（M11 全局收口审查 P1-1 登记项）。
      - name: 清理 compose 预置库/用户（对齐 README 从零重建流程）
        run: |
          docker exec ohrm-db mysql -uroot -proot_password_local -e \
            "DROP DATABASE IF EXISTS orangehrm; DROP USER IF EXISTS 'ohrm'@'%'; FLUSH PRIVILEGES;"

      - name: 首次安装 OrangeHRM（无人值守安装器，M6 实测流程）
        run: |
          # cli_install.php 是读配置文件的非交互入口（console 版纯交互 M6 实测）；
          # 安装器会自建库/表并自动删除容器内含口令的 yaml。
          docker cp docker/cli_install_config.yaml ohrm-app:/var/www/html/installer/
          docker exec -w /var/www/html ohrm-app php installer/cli_install.php

      - name: 创建 DB 校验只读账号（最小权限，M6 实测）
        run: |
          # ohrm_ro 仅 SELECT；账号由安装器建库后才有目标库可授权。
          docker exec ohrm-db mysql -uroot -proot_password_local -e \
            "CREATE USER IF NOT EXISTS 'ohrm_ro'@'%' IDENTIFIED WITH mysql_native_password BY 'ohrm_ro_password_local'; \
             GRANT SELECT ON orangehrm.* TO 'ohrm_ro'@'%'; FLUSH PRIVILEGES;"

      - name: 构建测试镜像（M10 Dockerfile）
        run: docker compose -f docker/docker-compose.yml build test

      # 2026-09-17 第二次真实触发实测（run 35195498493）：三层测试各 1~2 秒失败、
      # **exit code 3**、两份 artifact 全空。exit 3 = pytest INTERNALERROR（不是测试
      # 失败），说明 pytest 在**启动阶段**就崩了——1~2 秒且零产物，连 collect 都没到。
      # 启动阶段唯一会写磁盘的是 reports/：
      #   - pytest.ini `--alluredir=reports/allure-results`（allure 插件 configure 建目录）
      #   - conftest `pytest_configure` 建 screenshots / traces / logs
      # 而 M10 镜像 `USER tester`（uid 1000），runner 上 reports/ 属 runner（uid 1001，
      # 755）→ 容器内非 root 用户无法写该 bind mount → configure 钩子抛 PermissionError
      # → INTERNALERROR。本机已实测该签名：configure 抛 PermissionError → 退出码 3。
      # 为何本地没暴露：Docker Desktop（Windows）bind mount 不校验 Linux uid →
      # M10「容器内 18 passed」只证明了 Windows 行为，**未覆盖 Linux**。
      - name: 留痕目录授权（否则容器内非 root 用户无法写 → pytest 启动即 INTERNALERROR）
        run: |
          mkdir -p reports
          chmod -R a+rwX reports
          ls -ld reports

      # 让"修复是否真生效"自证：用容器内同一个非 root 用户去写该目录。
      # 探针失败会给出明确原因，避免下游三层再各报一次难解的 exit 3。
      - name: 校验留痕目录在容器内可写（探针）
        run: |
          docker compose -f docker/docker-compose.yml run --rm --entrypoint sh test -c \
            'touch /app/reports/.write_probe && rm /app/reports/.write_probe && echo "reports 容器内可写 OK"'

      # 分层容器内执行（M9 设计）：API 快先反馈；任一层红 → pipeline 红。
      # if: always() 保证 API 红也在本轮拿到 UI/e2e 结果（Review P2-3）：
      # 环境 flake 不该吃掉后续层的覆盖信息，最终判红仍由各层退出码保证。
      # 2026-09-17 修正：叠加 `steps.up.outcome == 'success'`——被测系统没起来时，
      # 后两层必然红，那种红是"连锁噪声"而非覆盖信息（首次真实触发实测：起服务
      # 步骤红 + UI/e2e 跟着红 + 两层 artifact 皆空，信号被污染）。
      - name: API 层（快，先反馈）
        run: docker compose -f docker/docker-compose.yml run --rm test -m api

      - name: UI 层
        if: always() && steps.up.outcome == 'success'
        run: docker compose -f docker/docker-compose.yml run --rm test -m ui

      - name: e2e 层（含 db 校验：容器内 BASE_URL=ohrm-app 被门控识别为本地）
        if: always() && steps.up.outcome == 'success'
        run: docker compose -f docker/docker-compose.yml run --rm test -m "e2e or db"

      - name: 上传 Allure 结果（M8）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: reports/allure-results

      - name: 上传失败留痕（M7 截图/Trace/log）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-artifacts
          path: |
            reports/screenshots
            reports/traces
            reports/logs