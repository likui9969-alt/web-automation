# OrangeHRM 自动化测试 CI（M9）
#
# 为什么需要 CI（PLAN M9）：本地能跑 = 起点，无人值守的回归 = 质量红线。
# 每次 push 自动验证「改代码没有破坏任何既有行为」——面试谈"自动化为什么
# 必须进 CI"的答案就长在 workflow 上。
#
# 分层执行顺序（为什么 API 先跑）：API 快（~30s）且稳，先跑出快速反馈；
# UI/e2e 慢且有公网波动，后跑。任何一层红 → pipeline 红（不允许静默）。
#
# CI 目标环境策略（M6 二轮 P2-2 硬性闭环，2026-09-16 决策）：
#   CI 固定跑 **公网 Demo**（项目默认目标，README 声明），DB 用例按环境
#   门控自动 skip（conftest 双重门控，公网必然 skip，不红不假绿）。
#   不选本地 Docker 的原因：CI runner 无 Docker daemon，起 MySQL+OrangeHRM
#   成本高、慢、脆弱，且 M6 内容在本地已实测；公网 flake（goto 超时/requests
#   瞬态）有 M7 留痕 + M8 报告兜底，失败可定位可重跑，详见 README「CI 与
#   flakes」节。requests 层不加代码重试的理由与记录也见该节。
#
# 国内网络说明：GitHub runner 在海外，playwright CDN / pip 均可达，
#   不需要 npmmirror 镜像（镜像只用于本机，M1 记录）。

name: CI

on:
  push:
  pull_request:

# 同分支连推时取消进行中的旧运行（M9 Review P3-3）：避免并发跑满 runner、
# 产物互相覆盖；新 push 代表最新代码，旧运行的结果无保留价值。
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 安装 Chromium（含系统依赖）
        run: |
          # 浏览器路径策略（M9 P0 修复：与 conftest.py setdefault 条件化配套）：
          #   - conftest 仅当项目内 .playwright-browsers 存在时才 setdefault → 本机走项目内；
          #   - CI runner 上该目录不存在 → 不设置 → 走 Playwright 默认路径，
          #     即 Linux 的 $HOME/.cache/ms-playwright（= playwright install 落点）。
          #   - 此处显式写 $HOME（bash 双引号内会展开；比 ~ 可靠，~ 是字面量）
          #     与 install 落点保证一致，是"文件级 + 代码级"双保险。
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"
          python -m playwright install --with-deps chromium

      # 分层执行（M9 设计）：API 快先反馈；任一层红 → pipeline 红。
      # if: always() 保证 API 红也在本轮拿到 UI/e2e 结果（Review P2-3）：
      # 公网 flake 不该吃掉后续层的覆盖信息，最终判红仍由各层退出码保证。
      - name: API 层（快，先反馈）
        run: python -m pytest -m api

      - name: UI 层
        if: always()
        run: python -m pytest -m ui

      - name: e2e 层
        if: always()
        run: python -m pytest -m e2e

      - name: 上传 Allure 结果（M8）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: reports/allure-results

      - name: 上传失败留痕（M7 截图/Trace/log）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-artifacts
          path: |
            reports/screenshots
            reports/traces
            reports/logs