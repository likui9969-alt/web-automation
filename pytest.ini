# 为什么需要 pytest.ini：
# 1. testpaths 固定测试入口，任何目录下执行 pytest 行为一致
# 2. --strict-markers 拼错 marker 直接报错，防止用例被静默跳过
# 3. ui / api / e2e 三个 marker 是测试分层的执行开关：
#    M9 CI 里先跑快的 api 再跑慢的 ui/e2e，靠 `pytest -m api` 实现
[pytest]
testpaths = tests
addopts = -v --strict-markers
markers =
    ui: UI 自动化测试（Playwright，慢、少而精，只测关键用户旅程）
    api: API 接口测试（Requests，快、稳定，业务规则主力）
    e2e: UI+API 混合闭环（M5：API 造数/验证 + UI 关键路径，金字塔顶层）
