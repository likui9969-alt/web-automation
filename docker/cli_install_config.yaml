# M6：OrangeHRM 5.9 无人值守安装配置（本地 Docker 副本专用）
# 原始模板位置：容器内 /var/www/html/installer/cli_install_config.yaml
# 用法（2026-09-15 实测修正，P2-3）：console 版（install:on-new-database）纯交互式
#   且拒绝 -n（stdin 为空时 getRequiredField() 崩溃）；cli_install.php 才读本配置文件
#   非交互执行（打印弃用告警但可用）。安装完成后安装器会自动删除容器内本 yaml。
#   docker cp docker/cli_install_config.yaml ohrm-app:/var/www/html/installer/
#   docker exec -w /var/www/html ohrm-app php installer/cli_install.php
# 重建注意：安装前需先 DROP compose 预置的空库/用户（on-new-database 语义一致），
#   步骤见 README「本地 Docker 环境」节。

database:
  hostName: db                # compose 服务名，同网络内 DNS 解析（不能用 127.0.0.1——容器内无 MySQL）
  hostPort: 3306
  databaseName: orangehrm
  privilegedDatabaseUser: root
  privilegedDatabasePassword: root_password_local
  useSameDbUserForOrangeHRM: n   # 应用账号与特权账号分离：安装用 root，运行用最小权限 ohrm
  orangehrmDatabaseUser: ohrm
  orangehrmDatabasePassword: ohrm_password_local
  isExistingDatabase: n         # 安装器自建库（先 DROP 预置空库再装，保证语义一致）
  enableDataEncryption: n

organization:
  name: Demo Org
  country: US                   # 安装器国家代码表默认值，避免非法代码中断安装

admin:
  adminUserName: Admin
  adminPassword: Admin@Local1   # 本地专用密码，与公网 Demo 的 admin/admin123 区分
  adminEmployeeFirstName: Local
  adminEmployeeLastName: Admin
  workEmail: admin@local.test
  contactNumber: ~
  registrationConsent: true

license:
  agree: y
