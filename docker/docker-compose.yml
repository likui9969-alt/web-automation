# M6：本地部署 OrangeHRM 5.9（被测系统的 Docker 化副本）
#
# 为什么需要本地：C1 约束——Demo 数据库不可直连（托管服务无 MySQL 端口暴露），
# DB 校验只能对自部署环境做。
# 明确标注：本地学习环境 ≠ Demo 线上环境，两环境结论不可互相套用（PLAN 风险登记册）。
#
# 端口：
#   8080  -> app（HTTP，BASE_URL 切 http://localhost:8080 即本地测试）
#   13306 -> MySQL（宿主机非默认端口，避免与本机既有 MySQL 冲突；pymysql 直连用）
#
# 安全（独立复审 P2-5 修复）：
#   - 端口绑定 127.0.0.1（loopback）：被测系统与 MySQL 不对局域网其他机器可见，
#     默认 "8080:80" 等价于绑定全部网卡，公开仓库前必须收回
#   - 口令走 compose 变量 ${VAR:-默认}：默认值保持可直接运行（与 .env.example 一致），
#     需要改口令时复制 .env.example 为 .env 覆盖即可（.env 已被 .gitignore 屏蔽）
#
# 首次启动需走 web installer（或容器内 CLI）：见 MODULE_FEEDBACK M6 验证记录。

services:
  db:
    image: mysql:8.0
    container_name: ohrm-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_local}
      MYSQL_DATABASE: orangehrm
      MYSQL_USER: ohrm
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ohrm_password_local}
    # pymysql 免 caching_sha2 依赖坑：本地学习环境用 native password 足够
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - ohrm_dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_password_local}"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    image: orangehrm/orangehrm:5.9
    container_name: ohrm-app
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ohrm_appdata:/var/www/html
    # M10 修正（M6 遗留）：app 无 healthcheck，导致 test 依赖
    # service_healthy 无法满足。root 302→login 或 200 即健康
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  # M10：测试执行环境（本仓库 Dockerfile 构建）。
  # 与 app/db 同网络：BASE_URL=http://ohrm-app（compose 服务名直连，无需端口映射）；
  # DB 直连容器内端口 3306（非宿主 13306）。run 一次即得与本地一致的全套测试。
  test:
    build:
      context: ..
      dockerfile: Dockerfile
    # Chromium 需要足够共享内存（/dev/shm 默认 64MB 会让浏览器进程崩溃：
    # launch 返回后 new_context 即 TargetClosedError —— M10 实测踩坑）
    shm_size: 1gb
    environment:
      ORANGEHRM_BASE_URL: http://ohrm-app
      ORANGEHRM_USERNAME: Admin
      ORANGEHRM_PASSWORD: ${ORANGEHRM_LOCAL_PASSWORD:-Admin@Local1}
      ORANGEHRM_DB_HOST: ohrm-db
      ORANGEHRM_DB_PORT: "3306"
      ORANGEHRM_DB_USER: ohrm_ro
      ORANGEHRM_DB_PASSWORD: ${ORANGEHRM_RO_PASSWORD:-ohrm_ro_password_local}
      # 容器内 chromium 与 tracing DOM 快照不兼容（M10 实测 TargetClosedError），
      # 关闭 snapshots 保留 screenshots（路径/截图仍可留痕）
      ORANGEHRM_TRACE_SNAPSHOTS: "false"
    depends_on:
      app:
        condition: service_healthy
    volumes:
      # 留痕/报告落宿主 reports/（容器内写，宿主看）
      - ../reports:/app/reports

volumes:
  ohrm_dbdata:
  ohrm_appdata: